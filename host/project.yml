name: Depth3DHost
options:
  bundleIdPrefix: dev.depth3d
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Release
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: "depth3d Host"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEVELOPMENT_LANGUAGE: zh-Hans
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Depth3DHostCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Depth3DHostCore
    settings:
      base:
        PRODUCT_NAME: Depth3DHostCore
        PRODUCT_BUNDLE_IDENTIFIER: dev.depth3d.host.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/Frameworks"
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: ApplicationServices.framework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: SystemConfiguration.framework
      - sdk: ServiceManagement.framework
      - sdk: ScreenCaptureKit.framework
  Depth3DHost:
    type: application
    platform: macOS
    sources:
      - path: Sources/Depth3DHost
        excludes:
          - Resources/Info.plist
    info:
      path: Sources/Depth3DHost/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: "depth3d Host"
        PRODUCT_BUNDLE_IDENTIFIER: dev.depth3d.host
        INFOPLIST_FILE: Sources/Depth3DHost/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: Depth3DHostCore
  Depth3DHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Depth3DHostTests
    dependencies:
      - target: Depth3DHostCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.depth3d.host.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
schemes:
  Depth3DHost:
    build:
      targets:
        Depth3DHost: all
        Depth3DHostTests: [test]
    test:
      targets:
        - Depth3DHostTests
