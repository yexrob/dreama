name: CI

# Every push to main and every pull request builds, tests and packages the
# headset app. A tag that starts with v also publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read only, apart from the release job below
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commits, with the release each one is beside it

jobs:
  android:
    name: Headset app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: player
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install the NDK the project pins
        # The runner's shell has pipefail on, and yes dies of SIGPIPE once
        # sdkmanager stops reading, so its exit code is not the one that counts
        run: |
          ndk=$(sed -n 's/.*ndkVersion "\(.*\)".*/\1/p' app/build.gradle)
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      - name: Version
        id: version
        run: |
          name=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testNonRootDebugUnitTest

      - name: Native unit tests
        run: make -C app/src/test/cpp test

      # With the keystore in the repository secrets, the release APK is signed
      # with the same key every time, so each build installs over the last one.
      # Without it the release APK is unsigned and only the debug APK installs,
      # and that one is signed with a key the runner makes up, so it cannot
      # update an earlier build without uninstalling first.
      - name: Signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key in the secrets: the release APK stays unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-dreama}"
            if [ -n "$KEY_PASSWORD" ]; then echo "keyPassword=$KEY_PASSWORD"; fi
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew --no-daemon :app:assembleNonRootDebug :app:assembleNonRootRelease

      - name: Name the packages
        run: |
          out="$RUNNER_TEMP/apk"
          mkdir -p "$out"
          tag="${{ steps.version.outputs.name }}-${{ steps.version.outputs.sha }}"
          cp app/build/outputs/apk/nonRoot/debug/app-nonRoot-debug.apk "$out/dreama-$tag-debug.apk"
          for f in app/build/outputs/apk/nonRoot/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" "$out/dreama-$tag-unsigned.apk" ;;
              *) cp "$f" "$out/dreama-$tag.apk" ;;
            esac
          done
          (cd "$out" && sha256sum *.apk | tee SHA256SUMS)

      - name: Remove the signing key
        if: always()
        run: rm -f release.keystore keystore.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dreama-apk
          path: ${{ runner.temp }}/apk/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: player/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  plugin-kit:
    name: Plugin kit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/plugin-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/plugin-kit/package-lock.json

      - run: npm ci

      - run: npm test

  # The one job that can write to the repository, and all it runs is the
  # release action on the APKs the build job made. Only a signed APK is
  # published: an unsigned one cannot be installed, so a tag pushed without
  # the secrets makes no release.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.outputs.signed == 'true'
    needs: [android, plugin-kit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dreama-apk
          path: apk

      - name: Keep the signed package
        run: rm -f apk/*-debug.apk apk/*-unsigned.apk && (cd apk && sha256sum *.apk > SHA256SUMS)

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            apk/*.apk
            apk/SHA256SUMS
          generate_release_notes: true
