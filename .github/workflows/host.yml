name: Mac host

# macOS runners cost more, so this only runs when the host app changes
on:
  push:
    branches: [main]
    paths: ['host/**', '.github/workflows/host.yml']
  pull_request:
    paths: ['host/**', '.github/workflows/host.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        working-directory: host
        run: swift test
