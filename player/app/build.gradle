apply plugin: 'com.android.application'
// Kotlin itself is built into AGP 9; these add Compose and Room's processor
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'

// Signing details for the sideloaded release build, kept out of the repo.
// Without the file the release build still works, it just comes out unsigned
// and has to be signed by hand the way the README describes.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def canSign = signingProps.containsKey('storePassword')

// Where the report a problem screens send reports and the token the collector
// expects. They live beside the signing details so neither is in the tree; the
// moonlightReportUrl and moonlightReportToken properties are only a fallback
// and stay empty in the tracked gradle.properties. A build with neither saves
// reports on the device and says it has no collector, see tools/report-worker.
def reportUrl = signingProps.getProperty('reportUrl', project.findProperty('moonlightReportUrl') ?: '')
def reportToken = signingProps.getProperty('reportToken', project.findProperty('moonlightReportToken') ?: '')
// A report carries the log, so it only ever travels over https. The app treats
// any other address as no collector, and the build says so rather than ship one.
if (!reportUrl.toString().trim().isEmpty()
        && !reportUrl.toString().trim().toLowerCase(Locale.ROOT).startsWith('https://')) {
    throw new GradleException("reportUrl has to start with https://, and '"
            + reportUrl.toString().trim() + "' does not. Fix it in keystore.properties"
            + " or -PmoonlightReportUrl, or leave it empty for a build without a collector.")
}
def javaString = { String value ->
    '"' + value.trim().replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// The commit a build came out of, so a report can be tied back to the tree,
// with a + where tracked files had changed. Empty without git, which is a
// build from a source download.
def gitHash = ''
try {
    def head = providers.exec {
        commandLine 'git', 'rev-parse', '--short=10', 'HEAD'
        ignoreExitValue = true
    }
    if (head.result.get().exitValue == 0) {
        gitHash = head.standardOutput.asText.get().trim()
        def diff = providers.exec {
            commandLine 'git', 'diff', '--quiet', 'HEAD', '--'
            ignoreExitValue = true
        }
        if (diff.result.get().exitValue != 0) {
            gitHash += '+'
        }
    }
} catch (Exception ignored) {
    gitHash = ''
}

// Turns xr_shared.h, the one file holding every constant the native renderer
// and the Java side agree on, into XrShared.java, so neither side carries a
// copy that can drift. The header is kept to plain #define lines of integer
// and float constants and expressions over earlier ones, which is all this
// reads; anything else fails the build rather than quietly producing Java
// that means something different.
abstract class GenerateXrShared extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getHeader()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        def headerFile = header.get().asFile
        def define = ~/^#define\s+([A-Z][A-Z0-9_]*)\s+(.+?)\s*$/
        def floats = [] as Set
        def defined = [] as Set
        def body = []
        boolean inGuard = false
        headerFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.startsWith('#ifndef')) {
                // The file comment above the include guard describes the header
                // itself, so the class starts with the first constant instead
                inGuard = true
                body.clear()
                return
            }
            if (!inGuard || trimmed.startsWith('#endif')) {
                return
            }
            if (trimmed.startsWith('//')) {
                body << '    ' + trimmed
                return
            }
            def m = define.matcher(line)
            if (!m.matches()) {
                if (trimmed.isEmpty() && !body.isEmpty() && body.last() != '') {
                    body << ''
                }
                return
            }
            def name = m.group(1)
            def value = m.group(2).replaceAll(/\s*\/\/.*$/, '').trim()
            if (!(value ==~ /[A-Za-z0-9_.+\-*\/() ]+/)) {
                throw new GradleException("${headerFile.name}: ${name} is not a plain constant: ${value}")
            }
            def names = value.findAll(/[A-Z][A-Z0-9_]*/)
            def unknown = names.findAll { !(it in defined) }
            if (!unknown.isEmpty()) {
                throw new GradleException("${headerFile.name}: ${name} refers to ${unknown} before it is defined")
            }
            boolean isFloat = value ==~ /.*\d[fF]\b.*/ || value.contains('.') || names.any { it in floats }
            if (isFloat) {
                floats << name
            }
            defined << name
            body << "    public static final ${isFloat ? 'float' : 'int'} ${name} = ${value};"
        }
        while (!body.isEmpty() && body.last() == '') {
            body.removeLast()
        }
        def out = new File(outputDir.get().asFile, 'com/limelight/binding/video/XrShared.java')
        out.parentFile.mkdirs()
        out.text = ([
            'package com.limelight.binding.video;',
            '',
            '/**',
            " * Every value the native renderer and this side agree on, generated from",
            " * ${headerFile.name} by the build. Change the header, not this file.",
            ' */',
            'public final class XrShared {',
            '    private XrShared() {',
            '    }',
            '',
        ] + body + ['}', '']).join('\n')
    }
}

// Room writes each database version's schema here, so a later version can
// be checked against it and given a migration rather than a wipe
ksp {
    arg('room.schemaLocation', "$projectDir/schemas".toString())
}

abstract class CopyPluginSchemas extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getSourceDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copySchemas() {
        def src = sourceDir.get().asFile
        def dst = new File(outputDir.get().asFile, 'plugin-schema')
        if (dst.exists()) {
            dst.deleteDir()
        }
        dst.mkdirs()
        src.listFiles({ f ->
            f.isFile() && (f.name.endsWith('.schema.json') || f.name == 'runtime-bootstrap.js')
        } as FileFilter)?.each { file ->
            new File(dst, file.name).bytes = file.bytes
        }
    }
}

def generateXrShared = tasks.register('generateXrShared', GenerateXrShared) {
    header = layout.projectDirectory.file('src/main/jni/xr-renderer/xr_shared.h')
    outputDir = layout.buildDirectory.dir('generated/source/xrshared')
}

// Single source of truth for plugin schemas shared between the Android host
// and tools/plugin-kit: bundle docs/specs/plugin-schema into Java resources.
def copyPluginSchemas = tasks.register('copyPluginSchemas', CopyPluginSchemas) {
    sourceDir = rootProject.layout.projectDirectory.dir('../docs/specs/plugin-schema')
    outputDir = layout.buildDirectory.dir('generated/resources/plugin-schema')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(generateXrShared, { it.outputDir })
        variant.sources.resources.addGeneratedSourceDirectory(copyPluginSchemas, { it.outputDir })
    }
}

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        // Compose, Room and activity-compose need 23; every headset is far above it
        minSdk 23
        targetSdk 36

        versionName "12.1-xr0.4.3"
        versionCode = 31407

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'

        // Where reports go and the token the collector expects, read above
        buildConfigField "String", "REPORT_URL", javaString(reportUrl.toString())
        buildConfigField "String", "REPORT_TOKEN", javaString(reportToken.toString())
        buildConfigField "String", "GIT_HASH", javaString(gitHash)
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        prefab = true
        resValues = true
        compose = true
    }

    androidResources {
        // The depth model is mmapped straight out of the APK
        noCompress 'tflite'
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.gilleece.moonlightxr.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "dev.depth3d.player"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile rootProject.file(signingProps.getProperty('storeFile', 'release.keystore'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias', 'moonlightvr')
                // Most keystores use one password for both
                keyPassword signingProps.getProperty('keyPassword',
                                                     signingProps.getProperty('storePassword'))
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "depth3d (Debug)"
            resValue "string", "app_label_root", "depth3d (Root Debug)"

            // The renderer's setprop tuning knobs and frame capture live in
            // debug builds only
            externalNativeBuild {
                ndkBuild {
                    arguments "XR_DEBUG_KNOBS=1"
                }
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-rules-debug.pro'
        }
        release {
            // This fork ships under its own applicationId, so the unofficial
            // suffix upstream asks forks to keep is no longer needed.
            resValue "string", "app_label", "depth3d"
            resValue "string", "app_label_root", "depth3d (Root)"

            if (canSign) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }

    sourceSets {
        // Expose Room exported schemas to Robolectric MigrationTestHelper in debug unit tests only
        debug.assets.srcDirs += files("$projectDir/schemas")
        test.assets.srcDirs += files("$projectDir/schemas")
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// Desktop JVM unit tests cannot load the Android .so inside quickjs-kt-android,
// so substitute the matching desktop JVM artifact for local unit test execution.
configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute(module('io.github.dokar3:quickjs-kt-android'))
            .using(module('io.github.dokar3:quickjs-kt-jvm:1.0.18'))
    }
}

dependencies {
    // Khronos OpenXR loader, Apache 2.0
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
    // LiteRT runtime and GPU delegate, Apache 2.0
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    // Plugin runtime: QuickJS binding (Apache 2.0; QuickJS MIT), HTML/XML DOM
    // parser (MIT), and Kotlin JSON AST (Apache 2.0).
    implementation 'io.github.dokar3:quickjs-kt:1.0.18'
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.13.0'

    // The 2D panel (the wall, library, details), Apache 2.0. Compose 1.12:
    // 1.13 (BOM 2026.11) will only build against the 37.1 SDK platform
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // Watch progress, Apache 2.0
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    // The headset player (local files, WebDAV, and what phones cast over
    // DLNA: MP4, FLV, HLS, DASH), Apache 2.0
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    // kXML 2, BSD style licence (its XmlPull API classes are public domain), the
    // parser Android itself reads host answers with, so tests can read them too
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    // Plugin runtime unit tests: MockWebServer (Apache 2.0), coroutines-test (Apache 2.0),
    // Room MigrationTestHelper (Apache 2.0), Robolectric (MIT), and SQLite JDBC (Apache 2.0).
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'androidx.room:room-testing:2.8.5'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'org.xerial:sqlite-jdbc:3.54.1.0'
}
